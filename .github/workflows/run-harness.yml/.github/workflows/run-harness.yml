# Runs the ML-KEM-768 implicit-rejection behavioral harness on a clean
# Ubuntu 24.04 runner with Python 3.12 and the pinned dependency.
name: Run ML-KEM-768 implicit-rejection harness

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-harness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip freeze
      - name: Run harness
        run: python harness/mlkem_implicit_rejection.py
